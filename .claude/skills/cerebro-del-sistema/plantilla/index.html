<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cerebro del Sistema</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
  <canvas id="estrellas"></canvas>
  <div id="grafo"></div>

  <div id="marca">
    <span id="marca-nombre">Cerebro del Sistema</span>
    <span id="marca-conteo" class="tenue"></span>
  </div>

  <div id="leyenda"></div>

  <div id="panel-nota" class="oculto">
    <button id="cerrar-nota" aria-label="cerrar">&times;</button>
    <div id="nota-categoria" class="tenue"></div>
    <h2 id="nota-titulo"></h2>
    <div id="nota-ruta" class="tenue"></div>
    <pre id="nota-texto"></pre>
    <button id="abrir-carpeta">Abrir carpeta</button>
  </div>

  <div id="buscador">
    <input id="buscar-input" type="text" placeholder="Buscar una nota..." autocomplete="off">
    <span id="buscar-resultado" class="tenue"></span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1/dist/3d-force-graph.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
